[project]
name = "bid-extractor-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "pymupdf4llm>=0.0.17",
    "mammoth>=1.8",
    "markdownify>=0.13",
    "python-magic>=0.4.27",
    "supabase>=2.9",
    "aiofiles>=24.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
